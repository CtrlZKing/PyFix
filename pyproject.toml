[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyFix-debugger"
version = "2.0.1"
description = "Python errors, explained and fixed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aditya Barua", email = "aditya.barua.dev.official@gmail.com" }
]
dependencies = []

[project.scripts]
pyfix = "pyfix.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]